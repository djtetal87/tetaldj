name: sidedeck
description: Android DJ deck for local files and Subsonic.
publish_to: "none"
version: 1.1.2+8

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^13.0.1
  ffi: ^2.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  http: ^1.6.0
  crypto: ^3.0.7
  sqflite: ^2.4.3
  file_picker: 8.1.4
  tetaldj_engine:
    path: packages/tetaldj_engine
  flutter_midi_command: ^1.4.0

# The Windows implementation of flutter_midi_command needs win32 6 while
# file_picker 8.1.4 needs win32 5; we never ship Windows, so a stub stands in.
dependency_overrides:
  flutter_midi_command_windows:
    path: packages/flutter_midi_command_windows_stub

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/spleeter4.fp16.onnx
    - assets/midi/pioneer-ddj-sr.json
